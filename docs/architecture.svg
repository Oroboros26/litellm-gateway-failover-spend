<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
    <filter id="s" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".12"/></filter>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fdf4"/><stop offset="1" stop-color="#dcfce7"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf5ff"/><stop offset="1" stop-color="#ede9fe"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbeb"/><stop offset="1" stop-color="#fef3c7"/></linearGradient>
  </defs>
  <rect width="1040" height="640" fill="#f8fafc"/>
  <text x="520" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">AI Gateway: one endpoint, many providers</text>
  <text x="520" y="60" text-anchor="middle" font-size="13" fill="#64748b">FastAPI edge + LiteLLM proxy + Postgres spend logs + Redis cache</text>

  <!-- column headers -->
  <g font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.5" text-anchor="middle">
    <text x="115" y="96">CLIENTS</text><text x="345" y="96">EDGE (FASTAPI)</text>
    <text x="620" y="96">LITELLM PROXY</text><text x="915" y="96">PROVIDERS</text>
  </g>

  <!-- clients -->
  <g filter="url(#s)">
    <rect x="30" y="115" width="170" height="70" rx="10" fill="url(#g1)" stroke="#3b82f6"/>
    <rect x="30" y="215" width="170" height="70" rx="10" fill="url(#g1)" stroke="#3b82f6"/>
    <rect x="30" y="315" width="170" height="70" rx="10" fill="url(#g1)" stroke="#3b82f6"/>
  </g>
  <g font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">
    <text x="115" y="145">search app</text><text x="115" y="245">support-bot</text><text x="115" y="345">sandbox</text></g>
  <g font-size="11" fill="#475569" text-anchor="middle">
    <text x="115" y="165">key sk-…a1 · $50 / 30d</text><text x="115" y="265">key sk-…b2 · $20 / 30d</text>
    <text x="115" y="365">key sk-…c3 · $1 / day · 10 rpm</text></g>

  <!-- edge -->
  <g filter="url(#s)"><rect x="250" y="115" width="190" height="270" rx="12" fill="url(#g2)" stroke="#16a34a" stroke-width="1.5"/></g>
  <g font-size="13" fill="#14532d">
    <g><circle cx="274" cy="150" r="11" fill="#16a34a"/><text x="274" y="154" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
      <text x="294" y="148" font-weight="600">Custom auth</text><text x="294" y="164" font-size="11" fill="#475569">virtual key → team lookup</text></g>
    <g><circle cx="274" cy="205" r="11" fill="#16a34a"/><text x="274" y="209" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
      <text x="294" y="203" font-weight="600">PII redaction</text><text x="294" y="219" font-size="11" fill="#475569">email · IBAN · card · phone</text></g>
    <g><circle cx="274" cy="260" r="11" fill="#16a34a"/><text x="274" y="264" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
      <text x="294" y="258" font-weight="600">Request tagging</text><text x="294" y="274" font-size="11" fill="#475569">team:… · feature:…</text></g>
    <g><circle cx="274" cy="315" r="11" fill="#16a34a"/><text x="274" y="319" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
      <text x="294" y="313" font-weight="600">Clean errors</text><text x="294" y="329" font-size="11" fill="#475569">budget → 429 budget_exceeded</text></g>
  </g>

  <!-- litellm -->
  <g filter="url(#s)"><rect x="500" y="115" width="240" height="270" rx="12" fill="url(#g3)" stroke="#7c3aed" stroke-width="1.5"/></g>
  <g font-size="13" fill="#4c1d95">
    <rect x="516" y="130" width="208" height="52" rx="8" fill="#fff" stroke="#c4b5fd"/>
    <text x="528" y="150" font-weight="600">Virtual keys · budgets</text>
    <text x="528" y="168" font-size="11" fill="#475569">per-team $ cap, rpm / tpm limits</text>
    <rect x="516" y="192" width="208" height="102" rx="8" fill="#fff" stroke="#c4b5fd"/>
    <text x="528" y="212" font-weight="600">Router</text>
    <text x="528" y="230" font-size="11" fill="#475569">• load-balance across deployments</text>
    <text x="528" y="246" font-size="11" fill="#475569">• 2 retries, 20 s timeout</text>
    <text x="528" y="262" font-size="11" fill="#475569">• cooldown after 2 fails / min (15 s)</text>
    <text x="528" y="278" font-size="11" fill="#475569">• fallback chat → chat-local</text>
    <rect x="516" y="304" width="208" height="64" rx="8" fill="#fff" stroke="#c4b5fd"/>
    <text x="528" y="324" font-weight="600">Cache lookup</text>
    <text x="528" y="342" font-size="11" fill="#475569">identical prompt → Redis hit,</text>
    <text x="528" y="357" font-size="11" fill="#475569">skips provider, $0, ~10 ms</text>
  </g>

  <!-- providers -->
  <g filter="url(#s)">
    <rect x="830" y="115" width="190" height="70" rx="10" fill="url(#g4)" stroke="#d97706"/>
    <rect x="830" y="215" width="190" height="70" rx="10" fill="url(#g4)" stroke="#d97706"/>
    <rect x="830" y="315" width="190" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="6 4"/>
  </g>
  <g font-size="14" font-weight="600" text-anchor="middle" fill="#78350f">
    <text x="925" y="145">OpenAI</text><text x="925" y="245">Anthropic</text>
    <text x="925" y="345" fill="#334155">Ollama (local)</text></g>
  <g font-size="11" fill="#475569" text-anchor="middle">
    <text x="925" y="165">gpt-4o-mini · primary</text><text x="925" y="265">claude-haiku-5-5 · primary</text>
    <text x="925" y="365">llama3.1:8b · last-resort fallback</text></g>

  <!-- request flow arrows -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M200 150H248"/><path d="M200 250H248"/><path d="M200 350H248"/>
    <path d="M440 250H498"/>
    <path d="M740 150H828"/><path d="M740 250H828"/>
  </g>
  <text x="469" y="242" text-anchor="middle" font-size="10" fill="#64748b">clean +</text>
  <text x="469" y="255" text-anchor="middle" font-size="10" fill="#64748b">tagged</text>
  <!-- failover arrow -->
  <path d="M740 350H828" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#r)"/>
  <text x="784" y="342" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">failover</text>

  <!-- data stores -->
  <g filter="url(#s)">
    <rect x="500" y="440" width="105" height="60" rx="10" fill="#fef2f2" stroke="#dc2626"/>
    <rect x="635" y="440" width="105" height="60" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  </g>
  <g text-anchor="middle">
    <text x="552" y="466" font-size="14" font-weight="600" fill="#991b1b">Redis</text>
    <text x="552" y="484" font-size="11" fill="#475569">response cache</text>
    <text x="687" y="466" font-size="14" font-weight="600" fill="#1e40af">Postgres</text>
    <text x="687" y="484" font-size="11" fill="#475569">keys · spend logs</text></g>
  <g stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <path d="M552 385V438"/><path d="M687 385V438"/></g>

  <!-- project 6 -->
  <g filter="url(#s)"><rect x="830" y="440" width="190" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="6 4"/></g>
  <text x="925" y="466" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">Cost dashboard</text>
  <text x="925" y="484" text-anchor="middle" font-size="11" fill="#475569">project 6 · reads spend logs</text>
  <path d="M740 470H828" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#a)" stroke-dasharray="2 3"/>

  <!-- legend: failover timeline -->
  <rect x="30" y="535" width="990" height="85" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text x="48" y="560" font-size="13" font-weight="700" fill="#0f172a">Failover sequence (illustrative timings)</text>
  <g font-size="12" fill="#334155">
    <text x="48" y="583">t=0  OpenAI deployment fails → retry (×2) → request served by Anthropic (slow, ~7 s)</text>
    <text x="48" y="601">t≈4 s  2 failures/min reached → OpenAI cooled down 15 s, traffic goes straight to Anthropic; if both fail → Ollama</text>
  </g>
</svg>
