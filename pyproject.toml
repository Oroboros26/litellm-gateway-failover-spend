[project]
name = "litellm-gateway-failover-spend"
version = "0.1.0"
requires-python = ">=3.11"
# litellm itself runs as the container image; it is a dependency, not forked.
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
